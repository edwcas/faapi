name: CI/CD Demo

on:
  push:          # la accion que gatillara este pipeline
    branches:    # se gatillara a esta rama
      - main
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest  # es runner  en gitlab -> en jenkins parace que es en el mismo server donde se ejecuta
    steps:
      - name: Checkout
        uses: actions/checkout@v3  # que actions vas a usar, con esto your workflow can access al repo (clona) y luego push (definido arriba en on) https://github.com/actions/checkout
      
      - name: install dependencies
        run: |
          pip3 install -r requirements.txt
      
      - name: run tests   # antes de construir el codigo realizas test
        run: |
          pytest test/test.py
      
      - name: build docker image
        run: |  # github.sha es el hash del commit (al hacer git log) colocamos para etiquetarlo
          docker build -t ${{secrets.DOCKER_USERNAME}}/appdemocopy:${{ github.sha }} .  
      
      - name: docker login  
        uses: docker/login-action@v2  # para loguerate al registri de docker
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: push docker image
        run: |
          docker push edw1/appdemocopy:${{ github.sha }}

